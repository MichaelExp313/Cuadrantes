<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuadrantes</title>
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuadrantes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --text:#141a24; --muted:#6b7385;
    --line:#e3e7ef; --accent:#1f6feb; --accent-soft:#e8f0fe; --danger:#d93036;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1218; --card:#181c24; --text:#e9edf5; --muted:#9099ab;
      --line:#2a303c; --accent:#4c8dff; --accent-soft:#1c2a44; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* Barra superior */
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
    padding:calc(var(--safe-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px}
  header h1{flex:1;margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
  header h1 img{width:26px;height:26px;border-radius:7px}
  .icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
  .icon-btn:active{background:var(--accent-soft)}
  .icon-btn svg{width:24px;height:24px}
  .add-btn{background:var(--accent);color:#fff}
  .add-btn:active{background:var(--accent);opacity:.85}

  main{flex:1;padding:16px 14px calc(var(--safe-bottom) + 24px);max-width:900px;width:100%;margin:0 auto}

  /* Título editable */
  .title-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  #title{flex:1;min-width:0;font-size:22px;font-weight:700;color:var(--text);background:transparent;
    border:1.5px solid transparent;border-radius:10px;padding:6px 8px;margin-left:-8px;outline:none}
  #title:focus{border-color:var(--accent);background:var(--card)}
  .meta{color:var(--muted);font-size:14px;margin:0 0 14px}
  .img-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .img-wrap img{display:block;width:100%;height:auto;border-radius:10px}
  .actions{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn svg{width:18px;height:18px}
  .btn.danger{color:var(--danger)}

  /* Vacío */
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty img{width:96px;height:96px;border-radius:24px;margin-bottom:16px}
  .empty h2{color:var(--text);margin:0 0 8px;font-size:20px}
  .empty .btn{display:inline-flex;flex:none;margin-top:18px;background:var(--accent);color:#fff;border:0;padding:12px 22px}

  /* Panel lateral por meses */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  .scrim.open{opacity:1;pointer-events:auto}
  aside{position:fixed;top:0;bottom:0;left:0;width:min(86vw,360px);background:var(--card);z-index:21;
    transform:translateX(-102%);transition:transform .25s ease;display:flex;flex-direction:column;
    padding-top:var(--safe-top);box-shadow:4px 0 24px rgba(0,0,0,.15)}
  aside.open{transform:none}
  aside .head{padding:16px 18px;font-size:18px;font-weight:700;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  aside .list{overflow-y:auto;flex:1;padding:6px 0 calc(var(--safe-bottom) + 20px)}
  .month{padding:16px 18px 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 18px}
  .item:active{background:var(--accent-soft)}
  .item.active{background:var(--accent-soft)}
  .item img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
  .item span{font-size:15px;font-weight:500;line-height:1.25}
  .item small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}

  /* Visor a pantalla completa */
  #viewer{position:fixed;inset:0;background:#000;z-index:30;display:none;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
  #viewer.open{display:block}
  #viewer img{display:block;width:100%;height:auto;min-height:100%;object-fit:contain;transition:width .2s}
  #viewer.zoom img{width:250%;min-height:0}
  #viewer .close{position:fixed;top:calc(var(--safe-top) + 10px);right:12px;width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,.18);color:#fff;font-size:24px;display:grid;place-items:center;backdrop-filter:blur(6px)}

  /* Hoja para cambiar mes/semana */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--card);border-radius:20px 20px 0 0;
    padding:10px 18px calc(var(--safe-bottom) + 18px);transform:translateY(105%);transition:transform .25s ease;
    max-width:560px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
  .sheet.open{transform:none}
  .sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
  .sheet h3{margin:0 0 14px;font-size:18px}
  .sheet label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
  .sheet select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
    color:var(--text);font:inherit;font-size:16px;appearance:none}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .week-opt{padding:10px;border-radius:12px;border:1.5px solid var(--line);text-align:left;background:var(--bg)}
  .week-opt b{display:block;font-size:15px}
  .week-opt small{color:var(--muted);font-size:12px}
  .week-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .check{display:flex !important;align-items:center;gap:8px;font-size:14px !important;color:var(--text) !important;margin-top:16px !important}
  .check input{width:20px;height:20px;accent-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border:0}
  .sheet .actions{margin-top:18px}
  .scrim.sheet-scrim{z-index:25}

  .toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 24px);transform:translate(-50%,20px);
    background:#141a24;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="menuBtn" aria-label="Ver cuadrantes por meses">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <h1><img src="icon.svg" alt="">Cuadrantes</h1>
  <button class="icon-btn add-btn" id="addBtn" aria-label="Añadir cuadrante">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</header>

<main id="main"></main>

<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-label="Cuadrantes por meses">
  <div class="head">Por meses
    <button class="icon-btn" id="closeDrawer" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="list" id="list"></div>
</aside>

<div class="scrim sheet-scrim" id="sheetScrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Cambiar mes y semana">
  <div class="grab"></div>
  <h3>Cambiar mes y semana</h3>
  <div class="row2">
    <div><label for="selMonth">Mes</label><select id="selMonth"></select></div>
    <div><label for="selYear">Año</label><select id="selYear"></select></div>
  </div>
  <label>Semana</label>
  <div class="weeks" id="weeks"></div>
  <label class="check"><input type="checkbox" id="updTitle"> Actualizar el título con las nuevas fechas</label>
  <div class="actions">
    <button class="btn" id="sheetCancel">Cancelar</button>
    <button class="btn primary" id="sheetSave">Guardar</button>
  </div>
</div>

<div id="viewer"><img id="viewerImg" alt=""><button class="close" id="viewerClose" aria-label="Cerrar">×</button></div>
<div class="toast" id="toast"></div>

<input type="file" id="fileInput" accept="image/*" hidden>

<script>
/* ---------- Base de datos local (IndexedDB) ---------- */
const DB_NAME = 'cuadrantes-db', STORE = 'cuadrantes';
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode), s = t.objectStore(STORE);
    const req = fn(s);
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
const getAll = () => tx('readonly', s => s.getAll());
const put    = item => tx('readwrite', s => s.put(item));
const remove = id => tx('readwrite', s => s.delete(id));

/* ---------- Fechas ---------- */
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// Lunes y domingo de la semana SIGUIENTE a la fecha dada
function nextWeek(date = new Date()){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const isoDow = d.getDay() || 7;               // lunes=1 … domingo=7
  const monday = new Date(d); monday.setDate(d.getDate() + (8 - isoDow));
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  return { monday, sunday };
}
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const rangeText = (m, s) => `${m.getDate()} ${MESES_CORTO[m.getMonth()]} – ${s.getDate()} ${MESES_CORTO[s.getMonth()]} ${s.getFullYear()}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const autoTitle = monday => `Cuadrante Semana ${monday.getDate()} - ${addDays(monday, 6).getDate()}`;

// Semanas de un mes = semanas cuyo lunes cae en ese mes (Semana 1 = primer lunes)
function mondaysOf(year, month){
  const first = new Date(year, month, 1);
  const iso = first.getDay() || 7;
  const d = new Date(year, month, 1 + ((8 - iso) % 7));
  const out = [];
  while (d.getMonth() === month){ out.push(new Date(d)); d.setDate(d.getDate() + 7); }
  return out;
}
const weekNum = monday => Math.ceil(monday.getDate() / 7);
const weekLabel = monday => `Semana ${weekNum(monday)} de ${MESES[monday.getMonth()].toLowerCase()}`;

/* ---------- Estado ---------- */
let items = [];        // ordenados del más reciente al más antiguo
let currentId = null;
const urls = new Map(); // id -> objectURL
const urlFor = it => { if (!urls.has(it.id)) urls.set(it.id, URL.createObjectURL(it.blob)); return urls.get(it.id); };

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function sortItems(){
  items.sort((a, b) => b.weekStart.localeCompare(a.weekStart) || b.createdAt - a.createdAt);
}

/* ---------- Vista principal ---------- */
function render(){
  const main = $('main');
  const it = items.find(i => i.id === currentId);
  if (!it){
    main.innerHTML = `
      <div class="empty">
        <img src="icon.svg" alt="">
        <h2>Aún no hay cuadrantes</h2>
        <p>Añade la foto o captura de tu cuadrante semanal.<br>Se titulará con la semana que viene automáticamente.</p>
        <button class="btn" id="emptyAdd">+ Añadir cuadrante</button>
      </div>`;
    $('emptyAdd').onclick = () => $('fileInput').click();
    renderList();
    return;
  }
  const m = fromISO(it.weekStart), s = new Date(m); s.setDate(m.getDate() + 6);
  main.innerHTML = `
    <div class="title-row">
      <input id="title" value="${esc(it.title)}" aria-label="Título del cuadrante" enterkeyhint="done">
      <button class="icon-btn" id="editBtn" aria-label="Editar título">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>
    <p class="meta">${weekLabel(m)} · ${rangeText(m, s)}</p>
    <div class="img-wrap"><img id="mainImg" src="${urlFor(it)}" alt="${esc(it.title)}"></div>
    <div class="actions">
      <button class="btn" id="weekBtn" style="flex:1 1 100%">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Cambiar mes / semana
      </button>
    </div>
    <div class="actions">
      <button class="btn" id="fullBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Ampliar
      </button>
      <button class="btn danger" id="delBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Eliminar
      </button>
    </div>`;

  const t = $('title');
  const save = async () => {
    const v = t.value.trim();
    if (!v){ t.value = it.title; return; }
    if (v !== it.title){ it.title = v; await put(it); renderList(); toast('Título guardado'); }
  };
  t.addEventListener('blur', save);
  t.addEventListener('keydown', e => { if (e.key === 'Enter') t.blur(); });
  $('editBtn').onclick = () => { t.focus(); t.select(); };
  $('mainImg').onclick = $('fullBtn').onclick = () => openViewer(it);
  $('weekBtn').onclick = () => openSheet(it);
  $('delBtn').onclick = async () => {
    if (!confirm(`¿Eliminar "${it.title}"?`)) return;
    await remove(it.id);
    if (urls.has(it.id)){ URL.revokeObjectURL(urls.get(it.id)); urls.delete(it.id); }
    items = items.filter(i => i.id !== it.id);
    currentId = latestAdded()?.id ?? null;
    render(); toast('Cuadrante eliminado');
  };
  renderList();
}

/* ---------- Lista por meses ---------- */
function renderList(){
  const list = $('list');
  if (!items.length){ list.innerHTML = `<p class="month" style="text-transform:none">Sin cuadrantes todavía</p>`; return; }
  let html = '', lastKey = '';
  for (const it of items){
    const m = fromISO(it.weekStart);
    const key = `${m.getFullYear()}-${m.getMonth()}`;
    if (key !== lastKey){ html += `<div class="month">${MESES[m.getMonth()]} ${m.getFullYear()}</div>`; lastKey = key; }
    const s = new Date(m); s.setDate(m.getDate() + 6);
    html += `<button class="item ${it.id === currentId ? 'active' : ''}" data-id="${it.id}">
      <img src="${urlFor(it)}" alt=""><span>${esc(it.title)}<small>Semana ${weekNum(m)} · ${rangeText(m, s)}</small></span></button>`;
  }
  list.innerHTML = html;
  list.querySelectorAll('.item').forEach(b => b.onclick = () => {
    currentId = b.dataset.id; render(); closeDrawer(); window.scrollTo(0, 0);
  });
}

const latestAdded = () => items.reduce((a, b) => (!a || b.createdAt > a.createdAt) ? b : a, null);

/* ---------- Añadir ---------- */
$('addBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const { monday, sunday } = nextWeek(new Date());
  const it = {
    id: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)),
    title: autoTitle(monday),
    weekStart: toISO(monday),
    createdAt: Date.now(),
    blob: file
  };
  await put(it);
  items.push(it); sortItems();
  currentId = it.id;
  render(); window.scrollTo(0, 0);
  toast('Cuadrante añadido');
};

/* ---------- Panel ---------- */
const openDrawer = () => { $('drawer').classList.add('open'); $('scrim').classList.add('open'); };
const closeDrawer = () => { $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); };
$('menuBtn').onclick = openDrawer;
$('closeDrawer').onclick = $('scrim').onclick = closeDrawer;

/* ---------- Cambiar mes / semana ---------- */
let sheetItem = null, selMonday = null;
function openSheet(it){
  sheetItem = it;
  selMonday = fromISO(it.weekStart);
  const yNow = new Date().getFullYear(), y = selMonday.getFullYear();
  const years = [...new Set([yNow - 1, yNow, yNow + 1, y])].sort();
  $('selMonth').innerHTML = MESES.map((n, i) => `<option value="${i}">${n}</option>`).join('');
  $('selYear').innerHTML = years.map(v => `<option value="${v}">${v}</option>`).join('');
  $('selMonth').value = selMonday.getMonth();
  $('selYear').value = y;
  // Si el título sigue siendo el automático, se propone actualizarlo
  $('updTitle').checked = it.title === autoTitle(selMonday);
  renderWeeks();
  $('sheet').classList.add('open'); $('sheetScrim').classList.add('open');
}
function closeSheet(){ $('sheet').classList.remove('open'); $('sheetScrim').classList.remove('open'); }
function renderWeeks(){
  const mons = mondaysOf(+$('selYear').value, +$('selMonth').value);
  // Si la semana elegida no es de este mes, se mantiene el mismo número de semana (o la última)
  if (!mons.some(d => toISO(d) === toISO(selMonday))){
    const n = Math.min(weekNum(selMonday), mons.length);
    selMonday = mons[n - 1];
  }
  $('weeks').innerHTML = mons.map((d, i) => `
    <button class="week-opt ${toISO(d) === toISO(selMonday) ? 'sel' : ''}" data-d="${toISO(d)}">
      <b>Semana ${i + 1}</b><small>${d.getDate()} ${MESES_CORTO[d.getMonth()]} – ${addDays(d, 6).getDate()} ${MESES_CORTO[addDays(d, 6).getMonth()]}</small>
    </button>`).join('');
  $('weeks').querySelectorAll('.week-opt').forEach(b => b.onclick = () => { selMonday = fromISO(b.dataset.d); renderWeeks(); });
}
$('selMonth').onchange = $('selYear').onchange = renderWeeks;
$('sheetCancel').onclick = $('sheetScrim').onclick = closeSheet;
$('sheetSave').onclick = async () => {
  const it = sheetItem;
  it.weekStart = toISO(selMonday);
  if ($('updTitle').checked) it.title = autoTitle(selMonday);
  await put(it);
  sortItems(); closeSheet(); render();
  toast(`Movido a ${weekLabel(selMonday)}`);
};

/* ---------- Visor ---------- */
function openViewer(it){
  $('viewerImg').src = urlFor(it);
  $('viewer').classList.remove('zoom');
  $('viewer').classList.add('open');
}
$('viewerImg').onclick = () => $('viewer').classList.toggle('zoom');
$('viewerClose').onclick = () => $('viewer').classList.remove('open');

/* ---------- Aviso ---------- */
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- Inicio ---------- */
(async () => {
  db = await openDB();
  items = await getAll(); sortItems();
  currentId = latestAdded()?.id ?? null;   // siempre abre el último añadido
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
